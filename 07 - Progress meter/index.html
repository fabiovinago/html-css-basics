<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Meter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Progress Meter</h1>

    <label for="file">File Progress</label>
    <progress 
    id="file"
    max="100"
    value="50"
    50%>
    </progress>
    <br />

    <label for="fuel">Fuel:</label>
    <meter 
    id="fuel"
    value="50"
    min="0"
    max="100"
    low="30"
    high="90" 
    optimal="80">
    </meter>




</body>
</html>
