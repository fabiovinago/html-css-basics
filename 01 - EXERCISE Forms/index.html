<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Appartement Search</h1>
    <div>
        <label for="location">Location</label>
        <input type="text" name="location" id="location" placeholder="location">
    </div>
    <br />
    <div>
        <label for="monthly-price">Monthly Price</label>
        <input type="range" name="monthly-price" id="monthly-price">
    </div>
    <br />
    <div>
        <label for="bedrooms">Bedrooms</label>
        <input type="number" name="bedrooms" id="bedrooms" placeholder="bedrooms">
    </div>
    <br />
    <div>
        <label for="bathrooms">Bathrooms</label>
        <input type="number" name="bathrooms" id="bathrooms" placeholder="bathrooms">
    </div>
    <br />
    <div>
        <label for="pets">Pets Allowed</label>
        <input type="checkbox" name="pets" id="pets">
    </div>
    <br />
    <div>
        <label for="date-available">Date Available</label>
        <input type="date" name="date-available" id="date-available">
    </div>
    <br />
    <div>
        <label for="submit"></label>
        <input type="submit" name="submit" id="submit">
    </div>


    
</body>
