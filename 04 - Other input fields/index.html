<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Input Fields</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<h1>Other Input types</h1>
    <form>
        <div>
            <h2>Color Picker</h2>
            <label for="color">Color</label>
            <input 
            type="color" 
            name="color" 
            id="color">
        </div>
        <br />
        <div>
            <h2>Date Picker</h2>
            <label for="date">Date</label>
            <input 
            type="date" 
            name="date" 
            id="date">
        </div>
        <br />
        <div>
            <h2>Time Picker</h2>
            <label for="time">Time</label>
            <input 
            type="time" 
            name="time" 
            id="time">
        </div>
        <br />
        <div>
            <h2>Week Picker</h2>
            <label for="week">Week</label>
            <input 
            type="week" 
            name="week" 
            id="week">
        </div>
        <br />
        <div>
            <h2>Month Picker</h2>
            <label for="month">Month</label>
            <input 
            type="month" 
            name="month" 
            id="month">
        </div>
        <br />
        <div>
            <h2>Range Slider</h2>
            <label for="range">Range</label>
            <input 
            type="range" 
            name="range" id="range" 
            min="0" 
            max="100"
            step="10">
        </div>
        <br />
        <div>
            <label for="url">URL</label>
            <input 
            type="url"
            name="url"
            id="url">
        </div>
    </form>
    
    

</body>
</html>
